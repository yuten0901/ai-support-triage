[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-support-triage"
version = "1.0.0"
description = "Evidence-grounded LLM triage service for customer support operations (FastAPI + Anthropic)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yusuke Miyajima" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The real provider adapter. Kept optional so the service, its tests and the
# evaluation suite all install and run without it -- nothing in the default
# path imports `anthropic`. Installed in CI so that the adapter itself is
# type-checked and exercised against the bundled fake Messages API server.
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6",
    "anthropic>=0.40",
]

[project.scripts]
ai-support-triage-eval = "evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals", "fake_anthropic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "postgres: requires a real PostgreSQL server (skipped unless TEST_DATABASE_URL is set)",
    "live_provider: hits a real, paid LLM provider (skipped unless RUN_LIVE_PROVIDER_TESTS=1)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "evals"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "RET", "S", "DTZ"]
ignore = [
    # `assert` is the idiomatic pytest failure mechanism.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI style: callables in argument defaults are the documented pattern.
"app/api/**" = ["B008"]
"fake_anthropic/**" = ["B008"]
# Tests use hard-coded fake secrets and bind test servers to loopback.
"tests/**" = ["S105", "S106", "S104", "ARG001", "ARG002"]
"scripts/**" = ["S105", "S106", "T201"]
"evals/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["uvicorn.*", "anthropic.*"]
ignore_missing_imports = true

# Tests are type-checked, but not required to annotate every fixture-only test
# function. Everything else strict mode gives still applies.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
