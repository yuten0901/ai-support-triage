services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: local-compose-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://triage:local-compose-only@db:5432/triage
      API_KEY: local-compose-demo-key
      LLM_PROVIDER: fake
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    read_only: true
    tmpfs:
      - /tmp
